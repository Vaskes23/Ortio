name: Ortio
configFiles:
  Debug: Configuration/SampleCode.xcconfig
  Release: Configuration/SampleCode.xcconfig
options:
  bundleIdPrefix: com.example.apple-samplecode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
fileGroups:
  - README.md
  - CLAUDE.md
  - project.yml
  - .swiftlint.yml
  - docs
  - DeferredPrototypes
  - Requirements
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    CLANG_ENABLE_MODULES: "YES"
    CLANG_ENABLE_OBJC_ARC: "YES"
    CLANG_ENABLE_OBJC_WEAK: "YES"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
    MTL_FAST_MATH: "YES"
    CLANG_ANALYZER_NONNULL: "YES"
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: "YES"
    CLANG_WARN_BOOL_CONVERSION: "YES"
    CLANG_WARN_COMMA: "YES"
    CLANG_WARN_CONSTANT_CONVERSION: "YES"
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: "YES"
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: "YES"
    CLANG_WARN_EMPTY_BODY: "YES"
    CLANG_WARN_ENUM_CONVERSION: "YES"
    CLANG_WARN_INFINITE_RECURSION: "YES"
    CLANG_WARN_INT_CONVERSION: "YES"
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: "YES"
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: "YES"
    CLANG_WARN_OBJC_LITERAL_CONVERSION: "YES"
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: "YES"
    CLANG_WARN_RANGE_LOOP_ANALYSIS: "YES"
    CLANG_WARN_STRICT_PROTOTYPES: "YES"
    CLANG_WARN_SUSPICIOUS_MOVE: "YES"
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: "YES"
    CLANG_WARN__DUPLICATE_METHOD_MATCH: "YES"
    GCC_NO_COMMON_BLOCKS: "YES"
    GCC_WARN_64_TO_32_BIT_CONVERSION: "YES"
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: "YES"
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: "YES"
    GCC_WARN_UNUSED_VARIABLE: "YES"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: "YES"
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      ONLY_ACTIVE_ARCH: "YES"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      GCC_DYNAMIC_NO_PIC: "NO"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: "NO"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: "YES"
      MTL_ENABLE_DEBUG_INFO: "NO"
      COPY_PHASE_STRIP: "NO"

targets:
  Ortio:
    type: application
    platform: iOS
    productName: Ortio
    sources:
      - path: Ortio
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Ortio
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.apple-samplecode.Ortio${SAMPLE_CODE_DISAMBIGUATOR}"
        INFOPLIST_FILE: Ortio/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: D763CZ24GN
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Ortio/Preview Content\""
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "This app uses the camera to scan objects."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "This app uses the microphone so you can dictate model notes."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        STRIP_INSTALLED_PRODUCT: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

  OrtioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrtioTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Ortio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: learn.Memorize.MatyasVascak.OrtioTests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ortio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ortio"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D763CZ24GN
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "17.5"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Ortio:
    build:
      targets:
        Ortio: all
    run:
      config: Debug
      environmentVariables:
        - variable: GPU_FRAME_CAPTURE_VALIDATION_ENABLED
          value: "1"
          isEnabled: true
    test:
      config: Debug
      targets:
        - OrtioTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
