# SwiftLint configuration for Ortio

excluded:
  - Ortio.xcodeproj
  - OrtioWidgets
  - build
  - DerivedData
  - .build
  - Pods

opt_in_rules:
  - empty_count
  - closure_spacing
  - implicit_return
  - modifier_order
  - force_unwrapping

disabled_rules:
  - trailing_comma
  - identifier_name
  - type_name
  - switch_case_alignment
  - implicit_optional_initialization

line_length:
  warning: 160
  error: 250

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

force_cast:
  severity: warning

force_unwrapping:
  severity: warning

trailing_whitespace:
  ignores_empty_lines: true

nesting:
  type_level: 3
  function_level: 3

large_tuple:
  warning: 4
  error: 5
