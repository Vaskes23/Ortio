<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852">
  <defs>
    <linearGradient id="pointCloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect width="393" height="852" rx="47" ry="47"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screenClip)">
    <rect width="393" height="852" fill="#000000"/>

    <!-- Status bar -->
    <text x="36" y="23" fill="#FFFFFF" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(311, 11)">
      <rect x="0" y="5" width="3" height="7" rx="1" fill="#FFFFFF"/>
      <rect x="5" y="3" width="3" height="9" rx="1" fill="#FFFFFF"/>
      <rect x="10" y="1" width="3" height="11" rx="1" fill="#FFFFFF"/>
      <rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/>
    </g>
    <g transform="translate(335, 11)">
      <path d="M0,8 Q6,-6 12,8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M2,6 Q6,-3 10,6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="6" cy="9" r="1.5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(352, 12)">
      <rect x="0" y="0" width="25" height="12" rx="3" ry="3" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="25" y="3" width="2" height="5" rx="1" fill="#FFFFFF"/>
      <rect x="2" y="2" width="20" height="8" rx="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Dynamic Island -->
    <rect x="133.5" y="11" width="126" height="37" rx="18.5" ry="18.5" fill="#000000"/>

    <!-- Cancel button -->
    <text x="20" y="68" fill="#007AFF" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="17" font-weight="400">Cancel</text>

    <!-- Point cloud area -->
    <rect x="0" y="90" width="393" height="420" fill="url(#pointCloudGrad)"/>
    <g fill="#4a90d9" opacity="0.6">
      <circle cx="80" cy="200" r="1.5"/><circle cx="120" cy="180" r="1"/><circle cx="160" cy="220" r="1.8"/>
      <circle cx="200" cy="190" r="1.2"/><circle cx="240" cy="210" r="1.5"/><circle cx="280" cy="195" r="1"/>
      <circle cx="100" cy="250" r="1.3"/><circle cx="150" cy="270" r="1.5"/><circle cx="190" cy="240" r="1"/>
      <circle cx="230" cy="260" r="1.8"/><circle cx="270" cy="245" r="1.2"/><circle cx="310" cy="270" r="1.5"/>
      <circle cx="90" cy="310" r="1"/><circle cx="140" cy="300" r="1.5"/><circle cx="180" cy="320" r="1.2"/>
      <circle cx="220" cy="290" r="1.8"/><circle cx="260" cy="310" r="1"/><circle cx="300" cy="295" r="1.5"/>
      <circle cx="110" cy="350" r="1.2"/><circle cx="170" cy="360" r="1.5"/><circle cx="210" cy="340" r="1"/>
      <circle cx="250" cy="355" r="1.8"/><circle cx="290" cy="340" r="1.2"/>
    </g>
    <g fill="#6fb1fc" opacity="0.4">
      <circle cx="95" cy="215" r="1"/><circle cx="175" cy="235" r="1.2"/><circle cx="215" cy="205" r="0.8"/>
      <circle cx="255" cy="230" r="1.5"/><circle cx="295" cy="215" r="1"/><circle cx="115" cy="285" r="1.2"/>
      <circle cx="165" cy="295" r="0.8"/><circle cx="205" cy="275" r="1.5"/>
    </g>
    <g stroke="#4a90d9" stroke-width="0.5" fill="none" opacity="0.3">
      <ellipse cx="196" cy="300" rx="80" ry="60"/>
      <ellipse cx="196" cy="300" rx="80" ry="60" transform="rotate(60, 196, 300)"/>
      <ellipse cx="196" cy="300" rx="80" ry="60" transform="rotate(-60, 196, 300)"/>
    </g>

    <!-- Orbit indicators -->
    <g transform="translate(133, 540)">
      <!-- Orbit 1 - completed (green check) -->
      <circle cx="28" cy="14" r="14" fill="#34C759"/>
      <path d="M20,14 L25,19 L36,9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="46" y1="14" x2="58" y2="14" stroke="#333333" stroke-width="1.5"/>
      <!-- Orbit 2 - empty -->
      <circle cx="76" cy="14" r="14" fill="none" stroke="#333333" stroke-width="1.5"/>
      <text x="76" y="19" fill="#555555" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="600" text-anchor="middle">2</text>
      <line x1="94" y1="14" x2="106" y2="14" stroke="#333333" stroke-width="1.5"/>
      <!-- Orbit 3 - empty -->
      <circle cx="124" cy="14" r="14" fill="none" stroke="#333333" stroke-width="1.5"/>
      <text x="124" y="19" fill="#555555" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3</text>
    </g>

    <!-- Title -->
    <text x="196" y="610" fill="#FFFFFF" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="22" font-weight="700" text-anchor="middle">First segment complete.</text>

    <!-- Detail text -->
    <text x="196" y="648" fill="#999999" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="400" text-anchor="middle">
      <tspan x="196" dy="0">For best quality, capture three segments.</tspan>
    </text>

    <!-- Continue button (blue bg, white text) -->
    <rect x="20" y="738" width="353" height="50" rx="14" fill="#007AFF"/>
    <text x="196" y="769" fill="#FFFFFF" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Continue</text>

    <!-- Finish button (blue text, no bg) -->
    <text x="196" y="815" fill="#007AFF" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Finish</text>

    <!-- Home indicator -->
    <rect x="148" y="832" width="97" height="5" rx="2.5" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>